## ─────────────────────────────────────────────────────────────────────────────
## ha-hoymiles-dtupro — Home Assistant custom integration for Hoymiles DTU-Pro
## ─────────────────────────────────────────────────────────────────────────────
##
## All Python code lives under custom_components/hoymiles_dtupro/, which is what
## HACS ships to Home Assistant config directories:
##   - custom_components/hoymiles_dtupro/api/   pure async Modbus library
##   - custom_components/hoymiles_dtupro/       Home Assistant integration layer
##
## The HA layer imports from .api; tests exercise the api package with mocked
## pymodbus. HA-native tests use pytest-homeassistant-custom-component.
##
## License: MIT — see LICENSE and THIRD_PARTY_LICENSES.md for upstream credits.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-hoymiles-dtupro"
version = "1.1.1"
description = "Home Assistant custom integration for Hoymiles DTU-Pro (Modbus TCP)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Nicolas Diguet", email = "nicolas.diguet@gmail.com" }]
keywords = ["home-assistant", "hacs", "hoymiles", "solar", "photovoltaic", "modbus", "dtu-pro"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "pymodbus[serial]>=3.6,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-homeassistant-custom-component==0.13.316",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage      = "https://github.com/netnic0/ha-hoymiles-dtupro"
Documentation = "https://github.com/netnic0/ha-hoymiles-dtupro#readme"
Issues        = "https://github.com/netnic0/ha-hoymiles-dtupro/issues"
Changelog     = "https://github.com/netnic0/ha-hoymiles-dtupro/blob/main/CHANGELOG.md"

# ─── Setuptools (M0-I4: explicit package discovery) ───────────────────────────
[tool.setuptools.packages.find]
include = ["custom_components*"]
exclude = ["tests*", "lovelace_examples*"]

# ─── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    # pymodbus may emit DeprecationWarnings for old async APIs we don't trigger
    "ignore::DeprecationWarning:pymodbus.*",
    # HA core 2026.x emits DeprecationWarnings during bootstrap that we cannot fix downstream
    "ignore::DeprecationWarning:homeassistant.*",
    # aiohttp transitively triggers DeprecationWarnings via HA's HTTP layer
    "ignore::DeprecationWarning:aiohttp.*",
]

# ─── Coverage (M0-C3: source = pure-api package only — HA layer is pragma:no-cover offline) ───
[tool.coverage.run]
source = ["custom_components.hoymiles_dtupro.api"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 80

# ─── Mypy (M0-I3: api package only for M0; expand in M2 with pytest-homeassistant) ────
[tool.mypy]
python_version = "3.13"
strict = true
files = ["custom_components/hoymiles_dtupro/api"]
exclude = [
    "tests",                  # tests use AsyncMock, looser typing
]

# ─── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "SIM",           # flake8-simplify
    "RUF",           # ruff-specific
]
ignore = [
    "E501",  # line too long, handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # assert statements OK in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
