name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

# Avoid stacking redundant runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Mypy is scoped to the full integration package (HA layer + api) since
      # PR #5b. HA core / voluptuous / pymodbus imports are silenced via
      # pyproject.toml [[tool.mypy.overrides]].
      - name: mypy custom_components/hoymiles_dtupro
        run: mypy custom_components/hoymiles_dtupro

  test:
    name: Test pure-lib (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Coverage scoped to the pure library — see [tool.coverage.run].
      # HA-native tests live in the test-ha job and use a separate coverage scope.
      - name: pytest pure-lib with coverage
        run: pytest tests/test_client.py tests/test_decoder.py tests/test_exceptions.py tests/test_models.py --cov=custom_components.hoymiles_dtupro.api --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  test-ha:
    name: Test HA-native (Python 3.13)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # No pip cache here — pytest-homeassistant-custom-component drags in
          # the entire HA core stack and we want a clean slate per run to avoid
          # editable-install path-hook ghosts from older package layouts.

      - name: Install dev dependencies (incl. pytest-homeassistant-custom-component)
        # Non-editable install on purpose: an editable install creates a
        # `__editable__.*.finder.__path_hook__` shim that HA's custom-component
        # loader trips on while scanning sys.path during bootstrap.
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # HA-native tests exercise config_flow + coordinator + setup/unload via the
      # real Home Assistant core fixtures (hass, enable_custom_integrations).
      # Coverage floor is intentionally lower than the pure-api 80%: the HA layer
      # is glue code; behaviour quality lives in the pure api package's tests.
      - name: pytest HA-native with coverage
        run: pytest tests/test_config_flow.py tests/test_config_flow_coverage.py tests/test_coordinator.py tests/test_init.py tests/test_init_coverage.py tests/test_sensor.py tests/test_binary_sensor.py tests/test_diagnostics.py tests/test_options_flow.py tests/test_repairs.py --cov=custom_components.hoymiles_dtupro --cov-report=term-missing --cov-fail-under=60
