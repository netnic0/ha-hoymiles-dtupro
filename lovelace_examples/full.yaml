      # ═══════════════════════════════════════════════════════════════════════
      # SECTION 4 — CHARTS: Production vs Consommation
      # ═══════════════════════════════════════════════════════════════════════
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: "Courbes et historique"
            heading_style: title

      # Chart A: 24h area — Production vs Consommation
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Production vs Consommation (24h)"
              show_states: true
              colorize_states: true
            graph_span: 24h
            stacked: false
            apex_config:
              chart:
                height: 280
              yaxis:
                max: 7000
                min: 0
                labels:
                  formatter: |
                    EVAL:function(val) { return val + ' W'; }
              stroke:
                curve: smooth
                width: 2
              fill:
                type: gradient
                gradient:
                  shadeIntensity: 0.4
                  opacityFrom: 0.6
                  opacityTo: 0.1
            series:
              - entity: sensor.hoymiles_dtu_pro_<DTU_SN>_puissance_instantanee
                name: "Production PV"
                type: area
                color: "#f59e0b"
                fill_raw: last
                group_by:
                  func: avg
                  duration: 5min

              - entity: sensor.lixee_sinsts
                name: "Consommation"
                type: area
                color: "#3b82f6"
                fill_raw: last
                group_by:
                  func: avg
                  duration: 5min

      # Chart B: stacked daily energy bars (last 7 days)
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Energie journaliere (7 jours)"
              show_states: true
              colorize_states: true
            graph_span: 7d
            stacked: true
            chart_type: bar
            apex_config:
              chart:
                height: 280
              plotOptions:
                bar:
                  columnWidth: 60%
              xaxis:
                type: datetime
                labels:
                  datetimeFormatter:
                    day: "dd/MM"
              yaxis:
                labels:
                  formatter: |
                    EVAL:function(val) { return (val/1000).toFixed(1) + ' kWh'; }
            series:
              # Production today (today_production is a daily accumulator)
              - entity: sensor.hoymiles_dtu_pro_<DTU_SN>_energie_du_jour
                name: "Production"
                color: "#f59e0b"
                type: column
                group_by:
                  func: max
                  duration: 1d
                  fill: zero

              # Lixee daily consumption (conditional — hides when unavailable)
              - entity: sensor.lixee_sinsts
                name: "Consommation"
                color: "#3b82f6"
                type: column
                group_by:
                  func: sum
                  duration: 1d
                  fill: zero

      # ═══════════════════════════════════════════════════════════════════════
      # SECTION 5 — BILAN: radialBar autoconsommation + mushroom bilan
      # ═══════════════════════════════════════════════════════════════════════
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: "Bilan energetique"
            heading_style: title

      # radialBar gauge — autoconsommation rate
      # Formula: autoconsommation = min(production, consommation) / production * 100
      # Requires both sensors to be available. Falls back to 0 if Lixee missing.
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Taux d'autoconsommation"
            chart_type: radialBar
            apex_config:
              chart:
                height: 260
              plotOptions:
                radialBar:
                  hollow:
                    size: 55%
                  dataLabels:
                    name:
                      show: true
                      fontSize: 13px
                    value:
                      show: true
                      fontSize: 22px
                      fontWeight: bold
                      formatter: |
                        EVAL:function(val) { return val.toFixed(1) + '%'; }
              colors:
                - "#f59e0b"
              labels:
                - "Autoconso"
            series:
              # Virtual entity: use a template sensor if available, or compute
              # inline. Replace with sensor.autoconsommation_rate if you have one.
              - entity: sensor.hoymiles_dtu_pro_<DTU_SN>_puissance_instantanee
                name: "Autoconsommation"
                # transform computes min(pv, conso) / pv * 100 live
                # When Lixee is unavailable the value defaults to 0
                transform: |
                  EVAL:function(val, extra) {
                    const pv   = parseFloat(val) || 0;
                    const conso = parseFloat(extra.entity.states['sensor.lixee_sinsts']) || 0;
                    if (pv <= 0) return 0;
                    return Math.round(Math.min(pv, conso) / pv * 100);
                  }
                group_by:
                  func: last
                  duration: 1min

      # Bilan tiles — production, conso, autoconsomme, injection, import
      - type: grid
        column_span: 2
        cards:
          # Total production today
          - type: custom:mushroom-entity-card
            entity: sensor.hoymiles_dtu_pro_<DTU_SN>_energie_du_jour
            icon: mdi:solar-power-variant
            icon_color: amber
            primary_info: state
            secondary_info: name
            layout: horizontal

          # Lixee instantaneous consumption
          - type: conditional
            conditions:
              - entity: sensor.lixee_sinsts
                state_not: unavailable
            card:
              type: custom:mushroom-entity-card
              entity: sensor.lixee_sinsts
              icon: mdi:home-lightning-bolt
              icon_color: blue
              primary_info: state
              secondary_info: name
              layout: horizontal

          # Live power injected to grid = max(0, pv - conso)
          # Requires a template sensor — replace with your entity if it exists.
          - type: custom:mushroom-template-card
            primary: >-
              {% set pv = states('sensor.hoymiles_dtu_pro_<DTU_SN>_puissance_instantanee') | float(0) %}
              {% set conso = states('sensor.lixee_sinsts') | float(0) %}
              {% set inj = [pv - conso, 0] | max %}
              {{ inj | round(0) }} W
            secondary: "Injection reseau (live)"
            icon: mdi:transmission-tower-export
            icon_color: green
            layout: horizontal

          # Live power imported from grid = max(0, conso - pv)
          - type: custom:mushroom-template-card
            primary: >-
              {% set pv = states('sensor.hoymiles_dtu_pro_<DTU_SN>_puissance_instantanee') | float(0) %}
              {% set conso = states('sensor.lixee_sinsts') | float(0) %}
              {% set imp = [conso - pv, 0] | max %}
              {{ imp | round(0) }} W
            secondary: "Soutirage reseau (live)"
            icon: mdi:transmission-tower-import
            icon_color: red
            layout: horizontal

          # Autoconsomme live = min(pv, conso)
          - type: custom:mushroom-template-card
            primary: >-
              {% set pv = states('sensor.hoymiles_dtu_pro_<DTU_SN>_puissance_instantanee') | float(0) %}
              {% set conso = states('sensor.lixee_sinsts') | float(0) %}
              {% set auto = [pv, conso] | min %}
              {{ auto | round(0) }} W
            secondary: "Autoconsomme (live)"
            icon: mdi:home-lightning-bolt-outline
            icon_color: orange
            layout: horizontal

