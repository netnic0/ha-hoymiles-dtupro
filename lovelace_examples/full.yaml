# ─────────────────────────────────────────────────────────────────────────────
# Hoymiles DTU-Pro — Full "visual" Lovelace blueprint
# ─────────────────────────────────────────────────────────────────────────────
#
# Required HACS frontend plugins:
#   - mushroom                  https://github.com/piitaya/lovelace-mushroom
#   - apexcharts-card           https://github.com/RomRider/apexcharts-card
#   - button-card               https://github.com/custom-cards/button-card
#   - card-mod                  https://github.com/thomasloven/lovelace-card-mod
#   - vertical-stack-in-card    https://github.com/ofekashery/vertical-stack-in-card
#
# How to use:
#   1. Copy the `views:` block below into your `lovelace.yaml`
#      (or paste as a new dashboard via Settings -> Dashboards -> + Add Dashboard).
#   2. Replace EVERY placeholder in the table below:
#
#      Placeholder        Example value              Where to find it
#      ─────────────────  ─────────────────────────  ──────────────────────────
#      <DTU_SN>           4121a010e25c               DTU-Pro sticker / HA device
#      <INV_1>            1144a00c1cab               Onduleur Ouest 1 (lowercase)
#      <INV_2>            1144a00cf81d               Onduleur Ouest 2 (lowercase)
#      <INV_3>            1144a00cf0eb               Onduleur Ouest 3 (lowercase)
#      <INV_4>            1144a00cfa64               Onduleur Ouest 4 (lowercase)
#      <INV_5>            1144a00c09ef               Onduleur Est 1  (lowercase)
#      <INV_6>            1144a00cfdb8               Onduleur Est 2  (lowercase)
#      <INV_7>            1144a00cddd2               Onduleur Est 3  (lowercase)
#
#   3. Upload your panel image to HA at:
#        /config/www/images/energie/pv/pv_petit.png
#      (accessible in Lovelace as /local/images/energie/pv/pv_petit.png).
#      If you want separate images per orientation, also add:
#        /config/www/images/energie/pv/pv_petit_est.png
#
#   4. Reload Lovelace (Developer Tools -> YAML -> Reload resources).
#
# Layout overview:
#   Section 1 — Header:       animated button-card circle + KPI tiles
#   Section 2 — Panneaux Ouest: 4+4 button-card photo panels (ports 1 & 2)
#   Section 3 — Panneaux Est:   2+2+2 button-card photo panels (ports 1 & 2)
#   Section 4 — Charts:        ApexCharts 24h area + daily stacked bars
#   Section 5 — Bilan:         ApexCharts radialBar autoconsommation + mushroom bilan
#   Section 6 — Sante reseau:  7 x temperature + 7 x liaison RF
#
# Lixee (Linky smart meter) cards appear only if sensor.lixee_sinsts is not
# unavailable. Otherwise the conditional cards collapse automatically.
#
# Hardware context:
#   7 x HMS-1000-2T (2 MPPT ports each = 14 sensors per type)
#   Orientation convention used here:
#     Ouest (W) inverters: INV_1 .. INV_4   (8 panels, ports 1+2 each)
#     Est   (E) inverters: INV_5 .. INV_7   (6 panels, ports 1+2 each)
#
# Maximum plant power: 7 x 1000 W AC = 7000 W (used as apex_config.yaxis max)
#
# ─────────────────────────────────────────────────────────────────────────────

title: Photovoltaique
views:
  - title: Solaire
    path: pv-full
    icon: mdi:solar-power-variant
    type: sections
    max_columns: 4
    sections:

      # ═══════════════════════════════════════════════════════════════════════
      # SECTION 1 — HEADER: animated circle + KPI panel
      # ═══════════════════════════════════════════════════════════════════════
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: "Production solaire"
            heading_style: title

      # Animated circle (button-card) — left side, column_span 1
      - type: grid
        column_span: 1
        cards:
          # The circle ring is drawn with a CSS conic-gradient keyed on
          # the sensor state. Max plant power = 7000 W.
          # The JS template is kept under 25 lines; no fetch/eval used.
          - type: custom:button-card
            entity: sensor.hoymiles_dtu_pro_<DTU_SN>_puissance_instantanee
            show_name: false
            show_icon: false
            show_state: true
            tap_action:
              action: more-info
            styles:
              card:
                - background: |
                    [[[
                      const raw = parseFloat(entity.state) || 0;
                      const max = 7000;
                      const pct = Math.min(Math.round(raw / max * 100), 100);
                      const on  = 'rgba(251,191,36,0.85)';
                      const off = 'rgba(51,65,85,0.4)';
                      return `radial-gradient(circle at center, var(--card-background-color,#1e293b) 58%, transparent 58%),
                              conic-gradient(${on} ${pct}%, ${off} ${pct}%)`;
                    ]]]
                - border-radius: 50%
                - width: 120px
                - height: 120px
                - margin: 8px auto
                - padding: "0"
                - display: flex
                - align-items: center
                - justify-content: center
              state:
                - color: "#fbbf24"
                - font-size: 18px
                - font-weight: bold
                - text-align: center
                - z-index: "1"

      # KPI panel — right side, column_span 3
      - type: grid
        column_span: 3
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.hoymiles_dtu_pro_<DTU_SN>_puissance_instantanee
            icon: mdi:lightning-bolt
            icon_color: amber
            primary_info: state
            secondary_info: name
            layout: horizontal
            tap_action:
              action: more-info

          - type: custom:mushroom-entity-card
            entity: sensor.hoymiles_dtu_pro_<DTU_SN>_energie_du_jour
            icon: mdi:white-balance-sunny
            icon_color: orange
            primary_info: state
            secondary_info: name
            layout: horizontal
            tap_action:
              action: more-info

          - type: custom:mushroom-entity-card
            entity: sensor.hoymiles_dtu_pro_<DTU_SN>_energie_totale_cumul
            icon: mdi:sigma
            icon_color: deep-orange
            primary_info: state
            secondary_info: name
            layout: horizontal
            tap_action:
              action: more-info

          # CO2 avoided tile — uses a template sensor or static formula.
          # If you have a CO2 avoided sensor, replace the template string.
          - type: custom:mushroom-template-card
            primary: >-
              {% set kwh = states('sensor.hoymiles_dtu_pro_<DTU_SN>_energie_du_jour') | float(0) / 1000 %}
              {{ (kwh * 0.4) | round(2) }} kg CO2 economise
            secondary: "Facteur 400 g/kWh (France)"
            icon: mdi:leaf
            icon_color: green
            layout: horizontal
            tap_action:
              action: none

          # Alarm — shown always, color driven by state
          - type: custom:mushroom-entity-card
            entity: binary_sensor.hoymiles_dtu_pro_<DTU_SN>_alarme
            icon: mdi:alert-circle-outline
            icon_color: >-
              {% if is_state('binary_sensor.hoymiles_dtu_pro_<DTU_SN>_alarme', 'on') %}red{% else %}green{% endif %}
            primary_info: state
            secondary_info: name
            layout: horizontal
            tap_action:
              action: more-info

          # Lixee instantaneous consumption (conditional)
          - type: conditional
            conditions:
              - entity: sensor.lixee_sinsts
                state_not: unavailable
            card:
              type: custom:mushroom-entity-card
              entity: sensor.lixee_sinsts
              icon: mdi:home-lightning-bolt
              icon_color: blue
              primary_info: state
              secondary_info: last-changed
              layout: horizontal
              tap_action:
                action: more-info

      # ═══════════════════════════════════════════════════════════════════════
      # SECTION 2 — PANNEAUX OUEST (4 inverters x 2 ports = 8 panels)
      # ═══════════════════════════════════════════════════════════════════════
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: "Panneaux Ouest (8 panneaux)"
            heading_style: title

          # ── Ouest — row 1: port 1 of each Ouest inverter ──────────────────
          # Each button-card shows the power of one PV port with:
          #   - photo background from /local/images/energie/pv/pv_petit.png
          #   - gradient overlay tinted by output power (amber -> orange -> red)
          #   - white bold state centered on the card
          # Max per port: ~500 W (half of 1000 W inverter AC output).

          - type: custom:button-card
            entity: sensor.hoymiles_inverter_<INV_1>_puissance_instantanee_1
            name: "Ouest 1a"
            show_name: true
            show_state: true
            show_icon: false
            tap_action:
              action: more-info
            styles:
              card:
                - background-image: "url('/local/images/energie/pv/pv_petit.png')"
                - background-size: cover
                - background-position: center
                - height: 100px
                - border-radius: 8px
                - overflow: hidden
                - position: relative
                - padding: "0"
              state:
                - color: white
                - font-size: 14px
                - font-weight: bold
                - position: absolute
                - bottom: "8px"
                - width: 100%
                - text-align: center
                - text-shadow: "0 1px 3px rgba(0,0,0,0.8)"
                - background: |
                    [[[
                      const v = parseFloat(entity.state) || 0;
                      const max = 500;
                      if (v <= 10)  return 'linear-gradient(to top, rgba(226,188,116,0.75) 100%, transparent 0%)';
                      if (v <= 50)  return 'linear-gradient(to top, rgba(254,163,71,0.75) 100%, transparent 0%)';
                      if (v <= 150) return 'linear-gradient(to top, rgba(255,165,0,0.75) 100%, transparent 0%)';
                      return `linear-gradient(to top, rgba(255,69,0,0.75) ${Math.min(v/max*100,100)}%, rgba(255,165,0,0.4) 0%)`;
                    ]]]
              name:
                - color: white
                - font-size: 11px
                - position: absolute
                - top: "6px"
                - width: 100%
                - text-align: center
                - text-shadow: "0 1px 2px rgba(0,0,0,0.8)"

